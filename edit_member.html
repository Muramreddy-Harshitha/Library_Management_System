<!DOCTYPE html>
<html>
<head>
    <title>Edit Member</title>
</head>
<body>
    <h1>Update Member Details</h1>

    <form method="POST">
        <label>Name:</label>
        <input type="text" name="name"
               value="{{ member.name }}" required><br><br>

        <label>Email:</label>
        <input type="email" name="email"
               value="{{ member.email }}"><br><br>

        <label>Phone:</label>
        <input type="text" name="phone"
               value="{{ member.phone }}"><br><br>

        <label>Address:</label>
        <input type="text" name="address"
               value="{{ member.address }}"><br><br>

        <button type="submit">Update Member</button>
    </form>

    <br>
    <a href="/members">Back to Members</a>
</body>
</html>
