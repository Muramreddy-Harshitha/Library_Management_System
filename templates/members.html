<!DOCTYPE html>
<html>
<head>
    <title>Library Members</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #263859;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #263859;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Library Members</h1>

    <a href="/">Back to Home</a>

    <table>
        <tr>
            <th>Member ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Address</th>
            <th>Membership Date</th>
            <th>Action</th>
        </tr>

        {% for member in members %}
        <tr>
            <td>{{ member.member_id }}</td>
            <td>{{ member.name }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.phone }}</td>
            <td>{{ member.address }}</td>
            <td>{{ member.membership_date }}</td>
            <td>
    <a href="/edit-member/{{ member.member_id }}">Edit</a>

    <form action="/delete-member/{{ member.member_id }}" method="POST">
        <button type="submit">Delete</button>
    </form>
</td>
                
        </tr>
        {% endfor %}
    </table>

</body>
</html>
