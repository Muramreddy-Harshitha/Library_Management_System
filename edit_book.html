<!DOCTYPE html>
<html>
<head>
    <title>Update Book</title>
</head>
<body>

    <h1>Update Book Details</h1>

    <form method="POST">

        <label>Title:</label>
        <input type="text" name="title" value="{{ book.title }}" required><br><br>

        <label>Author:</label>
        <input type="text" name="author" value="{{ book.author }}"><br><br>

        <label>Publisher:</label>
        <input type="text" name="publisher" value="{{ book.publisher }}"><br><br>

        <label>Category:</label>
        <input type="text" name="category" value="{{ book.category }}"><br><br>

        <label>Price:</label>
        <input type="number" step="0.01" name="price" value="{{ book.price }}"><br><br>

        <label>Availability:</label>
        <select name="availability_status">
            <option value="Available" {% if book.availability_status == 'Available' %}selected{% endif %}>Available</option>
            <option value="Borrowed" {% if book.availability_status == 'Borrowed' %}selected{% endif %}>Borrowed</option>
        </select><br><br>

        <button type="submit">Update Book</button>

    </form>

    <br>
    <a href="/books">Back to Books</a>

</body>
</html>
